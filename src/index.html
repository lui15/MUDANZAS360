<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mudanzas360 | Mudanzas económicas en Madrid y toda España</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mudanzas360: mudanzas de viviendas y oficinas, portes, transportes y montaje de muebles desde Madrid a toda España. Pide tu presupuesto sin compromiso."
    />
    <meta name="theme-color" content="#0789e8" />
    <meta name="robots" content="index, follow" />

    <!-- CAMBIA ESTE DOMINIO POR EL TUYO -->
    <link rel="canonical" href="https://www.TU-DOMINIO.com/" />

    <!-- ICONO DE LA PESTAÑA (sustituye al logo de Angular) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230789e8'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='25' font-weight='800' text-anchor='middle' fill='white'%3E360%3C/text%3E%3C/svg%3E"
    />

    <!-- Redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Mudanzas360" />
    <meta property="og:title" content="Mudanzas360 | Mudanzas económicas en Madrid y toda España" />
    <meta
      property="og:description"
      content="Mudanzas, portes y transportes desde Madrid a cualquier punto de España. Pide tu presupuesto sin compromiso."
    />
    <meta property="og:url" content="https://www.TU-DOMINIO.com/" />
    <meta name="twitter:card" content="summary" />

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      DATOS ESTRUCTURADOS DE NEGOCIO LOCAL.
      Antes de publicar, añade "telephone" con tu número real
      (ejemplo: "telephone": "+34600000000",) y cambia el dominio de "url".
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MovingCompany",
        "name": "Mudanzas360",
        "description": "Mudanzas de viviendas y oficinas, portes, transportes y montaje de muebles desde Madrid a toda España.",
        "url": "https://www.TU-DOMINIO.com/",
        "image": "https://www.TU-DOMINIO.com/images/logo.png",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Madrid",
          "addressRegion": "Madrid",
          "addressCountry": "ES"
        },
        "areaServed": [
          { "@type": "City", "name": "Madrid" },
          { "@type": "Country", "name": "España" }
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Mudanzas de viviendas" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Mudanzas de oficinas" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Portes y transportes" }
          },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Montaje de muebles" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Guardamuebles" } }
        ]
      }
    </script>

    <!-- Preguntas frecuentes (coinciden con las de la web) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿En qué zonas trabajáis?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Estamos en Madrid y podemos desplazarnos a cualquier punto de España. La disponibilidad y las condiciones dependerán del servicio y del recorrido."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cómo puedo solicitar un presupuesto?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Rellena nuestro formulario paso a paso. Revisaremos la información y nos pondremos en contacto contigo para hablar de tu mudanza."
            }
          },
          {
            "@type": "Question",
            "name": "¿Enviar la solicitud me compromete a contratar?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. La solicitud sirve para conocer tu necesidad y preparar una propuesta. No supone ningún compromiso."
            }
          },
          {
            "@type": "Question",
            "name": "¿Puedo solicitar solo el transporte de un mueble?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. Selecciona Porte / transporte y explícanos qué necesitas trasladar, dónde hay que recogerlo y dónde entregarlo."
            }
          },
          {
            "@type": "Question",
            "name": "¿Cuándo recibiré respuesta?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Revisaremos tu solicitud y contactaremos contigo utilizando el medio que hayas indicado."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
