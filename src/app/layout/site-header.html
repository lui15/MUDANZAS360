<header class="site-header" [class.scrolled]="scroll.desplazado()">
  <div class="site-header-inner">
    <a class="brand" routerLink="/" aria-label="Mudanzas360, inicio" (click)="alPulsarLogo()">
      <img class="brand-logo" src="/images/logo.webp" alt="Mudanzas360" width="500" height="166" />
    </a>

    <nav class="desktop-nav" aria-label="Navegación principal">
      @for (e of enlaces; track e.ancla) {
        @if (enPortada()) {
          <a [attr.href]="e.ancla">{{ e.texto }}</a>
        } @else {
          <a [routerLink]="e.ruta" [fragment]="e.fragmento">{{ e.texto }}</a>
        }
      }
    </nav>

    <div class="header-actions">
      <a class="header-cta" href="#presupuesto" (click)="pedirPresupuesto($event)"
        >Pedir presupuesto <span>↗</span></a
      >
      <a
        class="mobile-cta"
        href="#presupuesto"
        aria-label="Pedir presupuesto"
        (click)="pedirPresupuesto($event)"
        >↗</a
      >
      <button
        type="button"
        class="menu-toggle"
        [class.open]="menuAbierto()"
        (click)="alternarMenu()"
        [attr.aria-expanded]="menuAbierto()"
        aria-controls="menu-movil"
        aria-label="Abrir o cerrar el menú"
      >
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <!-- MENÚ DESPLEGABLE (TABLET Y MÓVIL) -->
  <nav id="menu-movil" class="mobile-nav" [class.open]="menuAbierto()" aria-label="Navegación móvil">
    @for (e of enlaces; track e.ancla) {
      @if (enPortada()) {
        <a [attr.href]="e.ancla" (click)="cerrarMenu()">{{ e.texto }}</a>
      } @else {
        <a [routerLink]="e.ruta" [fragment]="e.fragmento" (click)="cerrarMenu()">{{ e.texto }}</a>
      }
    }
    <a class="mobile-nav-cta" href="#presupuesto" (click)="pedirPresupuesto($event)">
      Pedir presupuesto <span>↗</span>
    </a>
  </nav>
</header>
